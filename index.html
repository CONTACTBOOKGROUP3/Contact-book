<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Book</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">

    <!-- LEFT PANE: search + contact list -->
    <div class="list-pane">
      <div class="list-header">
        <div class="brand">
          <div class="brand-icon">📇</div>
          <span class="brand-name">Contact Book</span>
        </div>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search by name">
        </div>
      </div>

      <div class="contact-list" id="contactList">
        <p class="empty-state" id="emptyState">No contacts yet. Add your first contact.</p>
      </div>

      <div class="list-footer">
        <button id="addContactBtn" class="btn-primary">+ Add Contact</button>
      </div>
    </div>

    <!-- RIGHT PANE: contact details / add-edit form -->
    <div class="detail-pane" id="detailPane">
      <div class="detail-placeholder" id="detailPlaceholder">
        <p>Select a contact to view details, or click "Add Contact" to create a new one.</p>
      </div>

      <div class="detail-view hidden" id="detailView">
        <div class="detail-header">
          <div class="detail-avatar" id="detailAvatar">AA</div>
          <div class="detail-name-block">
            <h2 id="detailName">Contact Name</h2>
            <p class="detail-sub">Contact record</p>
          </div>
          <div class="detail-actions">
            <button id="editBtn" class="btn-secondary">Edit</button>
            <button id="deleteBtn" class="btn-danger">Delete</button>
          </div>
        </div>

        <div class="detail-fields">
          <div class="field-row">
            <p class="field-label">Phone number</p>
            <p class="field-value" id="detailPhone">-</p>
          </div>
          <div class="field-row">
            <p class="field-label">Email address</p>
            <p class="field-value" id="detailEmail">-</p>
          </div>
        </div>

        <div class="storage-note">✓ Saved to local storage</div>
      </div>

      <div class="form-view hidden" id="formView">
        <h2 id="formTitle">Add Contact</h2>

        <form id="contactForm">
          <label for="nameInput">Full Name</label>
          <input type="text" id="nameInput" placeholder="e.g. Adaeze Musa" required>
          <p class="error-message" id="nameError"></p>

          <label for="phoneInput">Phone Number</label>
          <input type="text" id="phoneInput" placeholder="e.g. +234 803 555 0142" required>
          <p class="error-message" id="phoneError"></p>

          <label for="emailInput">Email Address</label>
          <input type="text" id="emailInput" placeholder="e.g. name@email.com" required>
          <p class="error-message" id="emailError"></p>

          <div class="form-actions">
            <button type="submit" class="btn-primary">Save Contact</button>
            <button type="button" id="cancelBtn" class="btn-secondary">Cancel</button>
          </div>
        </form>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
